<!DOCTYPE html>
<html>
<head>
    <title>pond.graphics</title>
    <style>
        body { margin: 0; background: #fff }
        canvas { 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            /* Make canvas taller by 1/cos(45°) so it scales to 100vh */
            height: calc(100vh / 0.7071);
            transform: scaleY(0.7071);
            transform-origin: top;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
        const canvas = document.querySelector('canvas')
        const ctx = canvas.getContext('2d')

        // Store untransformed boundary points
        let boundaryPoints = []
        
        // Perspective constant
        const PERSPECTIVE = Math.cos(Math.PI/4) // cos(45°)
        
        // Real-world scale
        const POND_DIAMETER = 20 // meters
        const METERS_TO_PIXELS = radius => (radius / POND_DIAMETER) * Math.min(canvas.width, canvas.height) * 0.9
        
        // Physics timestep
        const FIXED_DT = 1/60 // 60hz physics
        
        // Fish parameters
        const FISH_COUNT = 100
        const BASE_FISH_LENGTH = 3 // base length in meters
        const FISH_LENGTH = METERS_TO_PIXELS(BASE_FISH_LENGTH)
        const MIN_FISH_SIZE = FISH_LENGTH * 0.3  // Much smaller minimum
        const MAX_FISH_SIZE = FISH_LENGTH * 2.0  // Much larger maximum
        const BASE_SPEED = 0.1 // meters per second
        const FISH_SPEED = METERS_TO_PIXELS(BASE_SPEED)
        
        let fishes = []
        
        class Fish {
            constructor(x, y) {
                this.pos = { x, y }
                this.vel = {
                    x: Math.random() * 2 - 1,
                    y: Math.random() * 2 - 1
                }
                const mag = Math.hypot(this.vel.x, this.vel.y)
                this.vel.x = (this.vel.x / mag) * FISH_SPEED
                this.vel.y = (this.vel.y / mag) * FISH_SPEED
                
                // Size distribution using exponential scaling
                const rand = Math.random()
                // Use exponential curve to heavily favor large sizes
                const expScale = Math.exp(rand * 3) - 1  // 0 to e³-1
                const normalizedExp = expScale / (Math.E ** 3 - 1)  // Normalize to 0-1
                // Apply power scaling for even more large fish
                const finalScale = Math.pow(normalizedExp, 2)
                this.size = MIN_FISH_SIZE + (MAX_FISH_SIZE - MIN_FISH_SIZE) * finalScale
                
                // Swimming parameters
                this.targetAngle = Math.atan2(this.vel.y, this.vel.x)
                this.currentAngle = this.targetAngle
                this.turnSpeed = 0.1
                this.maxTurnSpeed = 0.2
                
                // Natural swimming motion
                this.swimPhase = Math.random() * Math.PI * 2
                this.swimFrequency = 0.05 + Math.random() * 0.02
                this.speedVariation = 0.15
                
                // Wandering behavior
                this.wanderAngle = Math.random() * Math.PI * 2
                this.wanderStrength = 0.02
                
                // Schooling parameters
                this.visionRadius = this.size * 5
                this.separationRadius = this.size * 2
                this.schoolingStrength = 0.3
                this.separationStrength = 0.4
                this.schoolId = 0
                
                // Edge avoidance cooldown
                this.edgeCooldown = 0
                this.maxEdgeCooldown = 60 // frames
                
                // Calculate base speed based on size
                const sizeRatio = (this.size - MIN_FISH_SIZE) / (MAX_FISH_SIZE - MIN_FISH_SIZE)
                this.baseSpeed = FISH_SPEED * (1 - sizeRatio * 0.5)
            }
            
            // Get nearest boundary point and normal
            getNearestBoundary() {
                let minDist = Infinity
                let nearestNormal = { x: 0, y: 0 }
                let nearestPoint = { x: 0, y: 0 }
                let isVertex = false
                
                // First check vertices
                for (let i = 0; i < boundaryPoints.length; i++) {
                    const p = boundaryPoints[i]
                    const dx = this.pos.x - p.x
                    const dy = this.pos.y - p.y
                    const dist = Math.hypot(dx, dy)
                    
                    if (dist < minDist) {
                        minDist = dist
                        // Normal points from vertex to circle center
                        nearestNormal = {
                            x: dx / dist,
                            y: dy / dist
                        }
                        nearestPoint = p
                        isVertex = true
                    }
                }
                
                // Then check edges
                for (let i = 0, j = boundaryPoints.length - 1; i < boundaryPoints.length; j = i++) {
                    const p1 = boundaryPoints[i]
                    const p2 = boundaryPoints[j]
                    
                    // Edge vector
                    const ex = p2.x - p1.x
                    const ey = p2.y - p1.y
                    const len = Math.hypot(ex, ey)
                    
                    // Vector from point to line start
                    const px = this.pos.x - p1.x
                    const py = this.pos.y - p1.y
                    
                    // Project point onto line
                    const proj = (px * ex + py * ey) / len
                    const t = Math.max(0, Math.min(len, proj))
                    
                    // Closest point on line
                    const closestX = p1.x + (ex / len) * t
                    const closestY = p1.y + (ey / len) * t
                    
                    // Distance to line
                    const dx = this.pos.x - closestX
                    const dy = this.pos.y - closestY
                    const dist = Math.hypot(dx, dy)
                    
                    // Only use edge if it's closer than nearest vertex and point projects onto segment
                    if (dist < minDist && t > 0 && t < len) {
                        minDist = dist
                        // Normal points from edge to circle center
                        nearestNormal = {
                            x: dx / dist,
                            y: dy / dist
                        }
                        nearestPoint = { x: closestX, y: closestY }
                        isVertex = false
                    }
                }
                
                return { distance: minDist, normal: nearestNormal, point: nearestPoint, isVertex }
            }
            
            updateSchooling() {
                // Get boundary info for edge avoidance priority
                const boundary = this.getNearestBoundary()
                const turnDistance = this.size * 4
                const nearBoundary = boundary.distance < turnDistance
                
                // Handle edge cooldown
                if (this.edgeCooldown > 0) {
                    // During cooldown, focus entirely on moving away from boundary
                    const escapeAngle = Math.atan2(boundary.normal.y, boundary.normal.x)
                    const cooldownFactor = this.edgeCooldown / this.maxEdgeCooldown
                    
                    // Stronger influence when cooldown is high
                    this.targetAngle = this.currentAngle * (1 - cooldownFactor) + escapeAngle * cooldownFactor
                    
                    // Reduce cooldown
                    this.edgeCooldown--
                    return
                }
                
                let nearbyFish = []
                let tooCloseFish = []
                
                // Find nearby fish in same school
                for (const other of fishes) {
                    if (other === this || other.schoolId !== this.schoolId) continue
                    
                    const dx = other.pos.x - this.pos.x
                    const dy = other.pos.y - this.pos.y
                    const dist = Math.hypot(dx, dy)
                    
                    if (dist < this.visionRadius) {
                        nearbyFish.push(other)
                        
                        if (dist < this.separationRadius) {
                            tooCloseFish.push(other)
                        }
                    }
                }
                
                // Stronger boundary avoidance
                const boundaryFactor = nearBoundary ? 
                    Math.pow(Math.max(0, (boundary.distance - this.size) / (turnDistance - this.size)), 2) : 1
                
                // Calculate center of pond influence
                const toPondCenter = {
                    x: canvas.width/2 - this.pos.x,
                    y: canvas.height/2 - this.pos.y
                }
                const distToCenter = Math.hypot(toPondCenter.x, toPondCenter.y)
                const pondRadius = Math.min(canvas.width, canvas.height * PERSPECTIVE) * 0.45
                const centerBias = Math.max(0, Math.min(1, (distToCenter - pondRadius * 0.3) / (pondRadius * 0.4)))
                const centerAngle = Math.atan2(toPondCenter.y, toPondCenter.x)
                
                if (nearbyFish.length > 0 && boundaryFactor > 0) {
                    // Alignment - match average velocity of nearby fish
                    let avgVelX = 0
                    let avgVelY = 0
                    for (const fish of nearbyFish) {
                        avgVelX += Math.cos(fish.currentAngle)
                        avgVelY += Math.sin(fish.currentAngle)
                    }
                    const avgAngle = Math.atan2(avgVelY, avgVelX)
                    
                    // Cohesion - move toward center of nearby fish
                    let centerX = 0, centerY = 0
                    for (const fish of nearbyFish) {
                        centerX += fish.pos.x
                        centerY += fish.pos.y
                    }
                    centerX /= nearbyFish.length
                    centerY /= nearbyFish.length
                    
                    const towardsCenterAngle = Math.atan2(
                        centerY - this.pos.y,
                        centerX - this.pos.x
                    )
                    
                    // Blend schooling influences with boundary factor
                    const schoolInfluence = this.schoolingStrength * 
                        (1 - (this.size - MIN_FISH_SIZE) / (MAX_FISH_SIZE - MIN_FISH_SIZE)) * 
                        boundaryFactor
                    
                    // Combine angles with proper weighting
                    let targetX = Math.cos(this.targetAngle) * (1 - schoolInfluence) +
                        (Math.cos(avgAngle) * 0.5 + Math.cos(towardsCenterAngle) * 0.3 + Math.cos(centerAngle) * centerBias * 0.2) * schoolInfluence
                    
                    let targetY = Math.sin(this.targetAngle) * (1 - schoolInfluence) +
                        (Math.sin(avgAngle) * 0.5 + Math.sin(towardsCenterAngle) * 0.3 + Math.sin(centerAngle) * centerBias * 0.2) * schoolInfluence
                    
                    this.targetAngle = Math.atan2(targetY, targetX)
                } else if (centerBias > 0.5) {
                    // When alone and far from center, gently bias towards center
                    const centerInfluence = centerBias * 0.1
                    this.targetAngle = this.targetAngle * (1 - centerInfluence) + centerAngle * centerInfluence
                }
                
                // Separation - avoid too close fish
                if (tooCloseFish.length > 0) {
                    let avoidX = 0
                    let avoidY = 0
                    for (const fish of tooCloseFish) {
                        const dx = this.pos.x - fish.pos.x
                        const dy = this.pos.y - fish.pos.y
                        const dist = Math.hypot(dx, dy)
                        const weight = Math.pow(1 - (dist / this.separationRadius), 2)
                        avoidX += (dx / dist) * weight
                        avoidY += (dy / dist) * weight
                    }
                    const avoidanceAngle = Math.atan2(avoidY, avoidX)
                    
                    const separationInfluence = this.separationStrength * 
                        Math.min(1, tooCloseFish.length * 0.5) *
                        boundaryFactor
                    
                    // Blend separation using vector addition
                    let targetX = Math.cos(this.targetAngle) * (1 - separationInfluence) +
                        Math.cos(avoidanceAngle) * separationInfluence
                    let targetY = Math.sin(this.targetAngle) * (1 - separationInfluence) +
                        Math.sin(avoidanceAngle) * separationInfluence
                    
                    this.targetAngle = Math.atan2(targetY, targetX)
                }
            }
            
            updateSwimming(dt) {
                // Update swimming phase (scale by dt)
                this.swimPhase += this.swimFrequency * dt * 60 // Keep same frequency at 60hz
                
                // Calculate speed variation based on swimming motion
                const speedFactor = 1 + Math.sin(this.swimPhase) * this.speedVariation
                
                // Update wandering (scale by dt)
                this.wanderAngle += (Math.random() - 0.5) * 0.1 * dt * 60
                const wanderX = Math.cos(this.wanderAngle) * this.wanderStrength
                const wanderY = Math.sin(this.wanderAngle) * this.wanderStrength
                
                // Update schooling behavior
                this.updateSchooling()
                
                // Smoothly turn towards target angle (scale by dt)
                const angleDiff = ((this.targetAngle - this.currentAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI
                const turn = Math.max(-this.maxTurnSpeed, Math.min(this.maxTurnSpeed, angleDiff * this.turnSpeed)) * dt * 60
                this.currentAngle += turn
                
                // Update velocity based on current angle and speed
                const speed = this.baseSpeed * speedFactor
                this.vel.x = Math.cos(this.currentAngle) * speed + wanderX
                this.vel.y = Math.sin(this.currentAngle) * speed + wanderY
            }
            
            update(dt) {
                // Store old position
                const oldPos = { x: this.pos.x, y: this.pos.y }
                
                // Update swimming motion
                this.updateSwimming(dt)
                
                // Update position (scale by dt)
                this.pos.x += this.vel.x * dt * 60
                this.pos.y += this.vel.y * dt * 60
                
                // Get nearest boundary info
                const boundary = this.getNearestBoundary()
                
                // Start turning away before actual collision
                const turnDistance = this.size * 3
                if (boundary.distance < turnDistance) {
                    // Calculate ideal escape angle
                    const escapeAngle = Math.atan2(boundary.normal.y, boundary.normal.x)
                    
                    // Blend between current angle and escape angle based on distance
                    const blend = Math.max(0, Math.min(1, (turnDistance - boundary.distance) / turnDistance))
                    this.targetAngle = this.currentAngle * (1 - blend) + escapeAngle * blend
                    
                    // Increase turn speed when very close
                    this.maxTurnSpeed = 0.2 + Math.max(0, (this.size - boundary.distance) / this.size) * 0.3
                } else {
                    // Reset turn speed when safe
                    this.maxTurnSpeed = 0.2
                }
                
                // Check for actual collisions
                if (boundary.distance < this.size) {
                    // Move back to old position
                    this.pos = oldPos
                    
                    // Get boundary info at old position
                    const oldBoundary = this.getNearestBoundary()
                    
                    // Set target angle to boundary normal
                    this.targetAngle = Math.atan2(oldBoundary.normal.y, oldBoundary.normal.x)
                    
                    // Position fish at boundary + size distance along normal
                    const safetyMargin = 1.01
                    this.pos.x = oldBoundary.point.x + oldBoundary.normal.x * (this.size * safetyMargin)
                    this.pos.y = oldBoundary.point.y + oldBoundary.normal.y * (this.size * safetyMargin)
                    
                    // Trigger edge cooldown
                    this.edgeCooldown = this.maxEdgeCooldown
                    
                    // Add slight random variation to escape angle to prevent oscillation
                    this.targetAngle += (Math.random() - 0.5) * 0.2
                }
                
                // Update edge cooldown (scale by dt)
                if (this.edgeCooldown > 0) {
                    this.edgeCooldown = Math.max(0, this.edgeCooldown - dt * 60)
                }
            }
            
            draw(ctx) {
                ctx.save()
                ctx.translate(this.pos.x, this.pos.y)
                ctx.rotate(this.currentAngle)
                
                // Draw single teardrop shape
                ctx.fillStyle = '#000'
                ctx.beginPath()
                ctx.moveTo(-this.size, 0)
                
                // Add slight undulation to the body based on swim phase
                const undulation = Math.sin(this.swimPhase) * 0.2
                
                // Teardrop curve with undulation
                ctx.quadraticCurveTo(
                    this.size * 0.5, this.size * (0.5 + undulation),
                    this.size, 0
                )
                ctx.quadraticCurveTo(
                    this.size * 0.5, this.size * (-0.5 + undulation),
                    -this.size, 0
                )
                
                ctx.closePath()
                ctx.fill()
                
                ctx.restore()
            }
        }

        function createFishes() {
            const SCHOOLS = 3
            fishes = []
            
            // Create fish for each school in different areas
            for (let schoolId = 0; schoolId < SCHOOLS; schoolId++) {
                const fishPerSchool = Math.floor(FISH_COUNT / SCHOOLS)
                const startAngle = (schoolId / SCHOOLS) * Math.PI * 2
                const angleSpread = (Math.PI * 2) / SCHOOLS * 0.5
                
                for (let i = 0; i < fishPerSchool; i++) {
                    let x, y, fish
                    
                    do {
                        const angle = startAngle + (Math.random() - 0.5) * angleSpread
                        const pondRadius = Math.min(canvas.width, canvas.height * PERSPECTIVE) * 0.45
                        const minRadius = pondRadius * 0.2
                        const maxRadius = pondRadius * 0.5
                        const r = minRadius + Math.random() * (maxRadius - minRadius)
                        
                        x = canvas.width/2 + Math.cos(angle) * r
                        y = canvas.height/2 + Math.sin(angle) * r
                        
                        fish = new Fish(x, y)
                        fish.schoolId = schoolId
                        
                        // Set initial direction towards center of school area
                        const centerAngle = startAngle + (angleSpread / 2)
                        fish.targetAngle = centerAngle
                        fish.currentAngle = centerAngle
                        const speed = fish.baseSpeed
                        fish.vel.x = Math.cos(centerAngle) * speed
                        fish.vel.y = Math.sin(centerAngle) * speed
                        
                    } while (!isInPond(x, y))
                    
                    fishes.push(fish)
                }
            }
        }

        function resize() {
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight / PERSPECTIVE
            updateBoundary()
            createFishes()
        }

        // Create natural edge variations
        function getEdgePoints(radius, numPoints = 180) {
            const points = []
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2
                // Add subtle natural variation
                const r = radius * (1 + Math.sin(angle * 3) * 0.03 + Math.cos(angle * 7) * 0.02)
                points.push({
                    x: Math.cos(angle) * r,
                    y: Math.sin(angle) * r
                })
            }
            return points
        }

        function updateBoundary() {
            const radius = Math.min(
                canvas.width,
                canvas.height * PERSPECTIVE
            ) * 0.45
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            }

            boundaryPoints = getEdgePoints(radius).map(p => ({
                x: p.x + center.x,
                y: p.y + center.y
            }))
        }

        function isInPond(x, y) {
            let inside = false
            for (let i = 0, j = boundaryPoints.length - 1; i < boundaryPoints.length; j = i++) {
                const xi = boundaryPoints[i].x, yi = boundaryPoints[i].y
                const xj = boundaryPoints[j].x, yj = boundaryPoints[j].y
                
                const intersect = ((yi > y) !== (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)
                if (intersect) inside = !inside
            }
            return inside
        }

        function draw() {
            const currentTime = performance.now() / 1000
            const dt = Math.min(currentTime - lastTime, 1/30) // Cap dt at 1/30 to prevent spiral of death
            lastTime = currentTime
            
            // Clear canvas
            ctx.fillStyle = '#fff'
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            }

            // Transform points relative to center once
            const transformedPoints = boundaryPoints.map(p => ({
                x: p.x - center.x,
                y: p.y - center.y
            }))
            
            // Draw shadow
            ctx.save()
            const shadowOffset = Math.min(canvas.width, canvas.height) * 0.005
            ctx.translate(center.x + shadowOffset, center.y + shadowOffset)
            ctx.fillStyle = 'rgba(0,0,0,0.1)'
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                ctx.lineTo(transformedPoints[i].x, transformedPoints[i].y)
            }
            ctx.closePath()
            ctx.fill()
            ctx.restore()
            
            // Draw base pond
            ctx.save()
            ctx.translate(center.x, center.y)
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(...transformedPoints.map(p => Math.hypot(p.x, p.y))))
            gradient.addColorStop(0, '#e8f8f9')
            gradient.addColorStop(1, '#d4e9ea')
            ctx.fillStyle = gradient
            
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                ctx.lineTo(transformedPoints[i].x, transformedPoints[i].y)
            }
            ctx.closePath()
            ctx.fill()
            ctx.restore()
            
            // Update and draw fish
            for (const fish of fishes) {
                fish.update(dt)
                fish.draw(ctx)
            }
            
            // Draw pond overlay
            ctx.save()
            ctx.translate(center.x, center.y)
            ctx.fillStyle = 'rgba(232,248,249,0.9)'
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                ctx.lineTo(transformedPoints[i].x, transformedPoints[i].y)
            }
            ctx.closePath()
            ctx.fill()
            
            // Draw pond edge
            ctx.strokeStyle = '#000'
            ctx.lineWidth = 2
            ctx.stroke()
            ctx.restore()
            
            requestAnimationFrame(draw)
        }

        window.addEventListener('resize', resize)
        resize()

        // Pre-simulate for exactly 5 seconds using fixed timestep
        let time = 0
        while (time < 5) {
            for (const fish of fishes) {
                fish.update(FIXED_DT)
            }
            time += FIXED_DT
        }

        // Track time for main simulation
        let lastTime = performance.now() / 1000
        
        draw()
    </script>
</body>
</html>

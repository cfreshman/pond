<!DOCTYPE html>
<html>
<head>
    <title>pond.graphics</title>
    <style>
        body { margin: 0; background: #fff }
        canvas { 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            /* Make canvas taller by 1/cos(45°) so it scales to 100vh */
            height: calc(100vh / 0.7071);
            transform: scaleY(0.7071);
            transform-origin: top;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
        const canvas = document.querySelector('canvas')
        const ctx = canvas.getContext('2d')

        // Store untransformed boundary points
        let boundaryPoints = []

        // Perspective constant
        const PERSPECTIVE = Math.cos(Math.PI/4) // cos(45°)

        function resize() {
            // Match canvas dimensions to CSS size
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight / PERSPECTIVE
            
            // Update boundary points
            updateBoundary()
        }

        // Create natural edge variations
        function getEdgePoints(radius, numPoints = 180) {
            const points = []
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2
                // Add subtle natural variation
                const r = radius * (1 + Math.sin(angle * 3) * 0.03 + Math.cos(angle * 7) * 0.02)
                points.push({
                    x: Math.cos(angle) * r,
                    y: Math.sin(angle) * r
                })
            }
            return points
        }

        // Update boundary points
        function updateBoundary() {
            // Use the smaller of width or scaled height for radius
            const radius = Math.min(
                canvas.width,
                canvas.height * PERSPECTIVE
            ) * 0.45 // 90% of smaller dimension
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            }

            // Get edge points
            boundaryPoints = getEdgePoints(radius).map(p => ({
                x: p.x + center.x,
                y: p.y + center.y
            }))
        }

        // Helper to check if a point is inside the boundary polygon
        function isInPond(x, y) {
            let inside = false
            for (let i = 0, j = boundaryPoints.length - 1; i < boundaryPoints.length; j = i++) {
                const xi = boundaryPoints[i].x, yi = boundaryPoints[i].y
                const xj = boundaryPoints[j].x, yj = boundaryPoints[j].y
                
                const intersect = ((yi > y) !== (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)
                if (intersect) inside = !inside
            }
            return inside
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#fff'
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            }

            // Transform points relative to center once
            const transformedPoints = boundaryPoints.map(p => ({
                x: p.x - center.x,
                y: p.y - center.y
            }))
            
            // Draw shadow
            ctx.save()
            const shadowOffset = Math.min(canvas.width, canvas.height) * 0.005 // 0.5% of canvas size
            ctx.translate(center.x + shadowOffset, center.y + shadowOffset)
            ctx.fillStyle = 'rgba(0,0,0,0.1)'
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                const p = transformedPoints[i]
                ctx.lineTo(p.x, p.y)
            }
            ctx.closePath()
            ctx.fill()
            ctx.restore()
            
            // Draw pond
            ctx.save()
            ctx.translate(center.x, center.y)
            
            // Create radial gradient for depth
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(...transformedPoints.map(p => Math.hypot(p.x, p.y))))
            gradient.addColorStop(0, '#e8f8f9')
            gradient.addColorStop(1, '#d4e9ea')
            ctx.fillStyle = gradient
            
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                const p = transformedPoints[i]
                ctx.lineTo(p.x, p.y)
            }
            ctx.closePath()
            ctx.fill()
            ctx.restore()
            
            // Draw boundary points for debugging
            ctx.strokeStyle = 'black'
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.moveTo(boundaryPoints[0].x, boundaryPoints[0].y)
            for (let i = 1; i < boundaryPoints.length; i++) {
                const p = boundaryPoints[i]
                ctx.lineTo(p.x, p.y)
            }
            ctx.closePath()
            ctx.stroke()
            
            requestAnimationFrame(draw)
        }

        window.addEventListener('resize', resize)
        resize()
        draw()
    </script>
</body>
</html>

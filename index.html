<!DOCTYPE html>
<html>
<head>
    <title>pond.graphics</title>
    <style>
        body { margin: 0; background: #fff }
        canvas { 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            /* Make canvas taller by 1/cos(45°) so it scales to 100vh */
            height: calc(100vh / 0.7071);
            transform: scaleY(0.7071);
            transform-origin: top;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
        const canvas = document.querySelector('canvas')
        const ctx = canvas.getContext('2d')

        // Store untransformed boundary points
        let boundaryPoints = []
        
        // Perspective constant
        const PERSPECTIVE = Math.cos(Math.PI/4) // cos(45°)
        
        // Real-world scale
        const POND_DIAMETER = 20 // meters
        const METERS_TO_PIXELS = radius => (radius / POND_DIAMETER) * Math.min(canvas.width, canvas.height) * 0.9
        
        // Fish parameters
        const FISH_COUNT = 40
        const BASE_FISH_LENGTH = 3 // base length in meters
        const FISH_LENGTH = METERS_TO_PIXELS(BASE_FISH_LENGTH)
        const MIN_FISH_SIZE = FISH_LENGTH * 0.5
        const MAX_FISH_SIZE = FISH_LENGTH * 2.0
        const BASE_SPEED = 0.1 // meters per second
        const FISH_SPEED = METERS_TO_PIXELS(BASE_SPEED)
        
        let fishes = []
        
        class Fish {
            constructor(x, y) {
                this.pos = { x, y }
                this.vel = {
                    x: Math.random() * 2 - 1,
                    y: Math.random() * 2 - 1
                }
                const mag = Math.hypot(this.vel.x, this.vel.y)
                this.vel.x = (this.vel.x / mag) * FISH_SPEED
                this.vel.y = (this.vel.y / mag) * FISH_SPEED
                
                // Size distribution
                const rand = Math.random()
                this.size = MIN_FISH_SIZE + (MAX_FISH_SIZE - MIN_FISH_SIZE) * Math.pow(rand, 1.5)
                
                // Swimming parameters
                this.targetAngle = Math.atan2(this.vel.y, this.vel.x)
                this.currentAngle = this.targetAngle
                this.turnSpeed = 0.1 // radians per frame
                this.maxTurnSpeed = 0.2 // max radians per frame
                
                // Natural swimming motion
                this.swimPhase = Math.random() * Math.PI * 2
                this.swimFrequency = 0.05 + Math.random() * 0.02 // Slight variation between fish
                this.speedVariation = 0.15 // 15% speed variation
                
                // Wandering behavior
                this.wanderAngle = Math.random() * Math.PI * 2
                this.wanderStrength = 0.02
            }
            
            // Get nearest boundary point and normal
            getNearestBoundary() {
                let minDist = Infinity
                let nearestNormal = { x: 0, y: 0 }
                let nearestPoint = { x: 0, y: 0 }
                let isVertex = false
                
                // First check vertices
                for (let i = 0; i < boundaryPoints.length; i++) {
                    const p = boundaryPoints[i]
                    const dx = this.pos.x - p.x
                    const dy = this.pos.y - p.y
                    const dist = Math.hypot(dx, dy)
                    
                    if (dist < minDist) {
                        minDist = dist
                        // Normal points from vertex to circle center
                        nearestNormal = {
                            x: dx / dist,
                            y: dy / dist
                        }
                        nearestPoint = p
                        isVertex = true
                    }
                }
                
                // Then check edges
                for (let i = 0, j = boundaryPoints.length - 1; i < boundaryPoints.length; j = i++) {
                    const p1 = boundaryPoints[i]
                    const p2 = boundaryPoints[j]
                    
                    // Edge vector
                    const ex = p2.x - p1.x
                    const ey = p2.y - p1.y
                    const len = Math.hypot(ex, ey)
                    
                    // Vector from point to line start
                    const px = this.pos.x - p1.x
                    const py = this.pos.y - p1.y
                    
                    // Project point onto line
                    const proj = (px * ex + py * ey) / len
                    const t = Math.max(0, Math.min(len, proj))
                    
                    // Closest point on line
                    const closestX = p1.x + (ex / len) * t
                    const closestY = p1.y + (ey / len) * t
                    
                    // Distance to line
                    const dx = this.pos.x - closestX
                    const dy = this.pos.y - closestY
                    const dist = Math.hypot(dx, dy)
                    
                    // Only use edge if it's closer than nearest vertex and point projects onto segment
                    if (dist < minDist && t > 0 && t < len) {
                        minDist = dist
                        // Normal points from edge to circle center
                        nearestNormal = {
                            x: dx / dist,
                            y: dy / dist
                        }
                        nearestPoint = { x: closestX, y: closestY }
                        isVertex = false
                    }
                }
                
                return { distance: minDist, normal: nearestNormal, point: nearestPoint, isVertex }
            }
            
            updateSwimming() {
                // Update swimming phase
                this.swimPhase += this.swimFrequency
                
                // Calculate speed variation based on swimming motion
                const speedFactor = 1 + Math.sin(this.swimPhase) * this.speedVariation
                
                // Update wandering
                this.wanderAngle += (Math.random() - 0.5) * 0.1
                const wanderX = Math.cos(this.wanderAngle) * this.wanderStrength
                const wanderY = Math.sin(this.wanderAngle) * this.wanderStrength
                
                // Smoothly turn towards target angle
                const angleDiff = ((this.targetAngle - this.currentAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI
                const turn = Math.max(-this.maxTurnSpeed, Math.min(this.maxTurnSpeed, angleDiff * this.turnSpeed))
                this.currentAngle += turn
                
                // Update velocity based on current angle and speed
                const speed = FISH_SPEED * speedFactor
                this.vel.x = Math.cos(this.currentAngle) * speed + wanderX
                this.vel.y = Math.sin(this.currentAngle) * speed + wanderY
            }
            
            update() {
                // Store old position
                const oldPos = { x: this.pos.x, y: this.pos.y }
                
                // Update swimming motion
                this.updateSwimming()
                
                // Update position
                this.pos.x += this.vel.x
                this.pos.y += this.vel.y
                
                // Get nearest boundary info
                const boundary = this.getNearestBoundary()
                
                // Start turning away before actual collision
                const turnDistance = this.size * 3
                if (boundary.distance < turnDistance) {
                    // Calculate ideal escape angle
                    const escapeAngle = Math.atan2(boundary.normal.y, boundary.normal.x)
                    
                    // Blend between current angle and escape angle based on distance
                    const blend = Math.max(0, Math.min(1, (turnDistance - boundary.distance) / turnDistance))
                    this.targetAngle = this.currentAngle * (1 - blend) + escapeAngle * blend
                    
                    // Increase turn speed when very close
                    this.maxTurnSpeed = 0.2 + Math.max(0, (this.size - boundary.distance) / this.size) * 0.3
                } else {
                    // Reset turn speed when safe
                    this.maxTurnSpeed = 0.2
                }
                
                // Still check for actual collisions as safety
                if (boundary.distance < this.size) {
                    // Move back to old position
                    this.pos = oldPos
                    
                    // Get boundary info at old position
                    const oldBoundary = this.getNearestBoundary()
                    
                    // Set target angle to boundary normal
                    this.targetAngle = Math.atan2(oldBoundary.normal.y, oldBoundary.normal.x)
                    
                    // Position fish at boundary + size distance along normal
                    const safetyMargin = 1.01
                    this.pos.x = oldBoundary.point.x + oldBoundary.normal.x * (this.size * safetyMargin)
                    this.pos.y = oldBoundary.point.y + oldBoundary.normal.y * (this.size * safetyMargin)
                }
            }
            
            draw(ctx) {
                ctx.save()
                ctx.translate(this.pos.x, this.pos.y)
                ctx.rotate(this.currentAngle)
                
                // Draw single teardrop shape
                ctx.fillStyle = '#000'
                ctx.beginPath()
                ctx.moveTo(-this.size, 0)
                
                // Add slight undulation to the body based on swim phase
                const undulation = Math.sin(this.swimPhase) * 0.2
                
                // Teardrop curve with undulation
                ctx.quadraticCurveTo(
                    this.size * 0.5, this.size * (0.5 + undulation),
                    this.size, 0
                )
                ctx.quadraticCurveTo(
                    this.size * 0.5, this.size * (-0.5 + undulation),
                    -this.size, 0
                )
                
                ctx.closePath()
                ctx.fill()
                
                ctx.restore()
            }
        }

        function createFishes() {
            fishes = Array.from({ length: FISH_COUNT }, () => {
                let x, y, fish
                
                do {
                    const angle = Math.random() * Math.PI * 2
                    const pondRadius = Math.min(canvas.width, canvas.height * PERSPECTIVE) * 0.45
                    const minRadius = pondRadius * 0.2
                    const maxRadius = pondRadius * 0.7
                    const r = minRadius + Math.random() * (maxRadius - minRadius)
                    
                    x = canvas.width/2 + Math.cos(angle) * r
                    y = canvas.height/2 + Math.sin(angle) * r
                    
                    fish = new Fish(x, y)
                } while (!isInPond(x, y))
                
                return fish
            })
        }

        function resize() {
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight / PERSPECTIVE
            updateBoundary()
            createFishes()
        }

        // Create natural edge variations
        function getEdgePoints(radius, numPoints = 180) {
            const points = []
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2
                // Add subtle natural variation
                const r = radius * (1 + Math.sin(angle * 3) * 0.03 + Math.cos(angle * 7) * 0.02)
                points.push({
                    x: Math.cos(angle) * r,
                    y: Math.sin(angle) * r
                })
            }
            return points
        }

        function updateBoundary() {
            const radius = Math.min(
                canvas.width,
                canvas.height * PERSPECTIVE
            ) * 0.45
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            }

            boundaryPoints = getEdgePoints(radius).map(p => ({
                x: p.x + center.x,
                y: p.y + center.y
            }))
        }

        function isInPond(x, y) {
            let inside = false
            for (let i = 0, j = boundaryPoints.length - 1; i < boundaryPoints.length; j = i++) {
                const xi = boundaryPoints[i].x, yi = boundaryPoints[i].y
                const xj = boundaryPoints[j].x, yj = boundaryPoints[j].y
                
                const intersect = ((yi > y) !== (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)
                if (intersect) inside = !inside
            }
            return inside
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#fff'
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            }

            // Transform points relative to center once
            const transformedPoints = boundaryPoints.map(p => ({
                x: p.x - center.x,
                y: p.y - center.y
            }))
            
            // Draw shadow
            ctx.save()
            const shadowOffset = Math.min(canvas.width, canvas.height) * 0.005
            ctx.translate(center.x + shadowOffset, center.y + shadowOffset)
            ctx.fillStyle = 'rgba(0,0,0,0.1)'
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                ctx.lineTo(transformedPoints[i].x, transformedPoints[i].y)
            }
            ctx.closePath()
            ctx.fill()
            ctx.restore()
            
            // Draw base pond
            ctx.save()
            ctx.translate(center.x, center.y)
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(...transformedPoints.map(p => Math.hypot(p.x, p.y))))
            gradient.addColorStop(0, '#e8f8f9')
            gradient.addColorStop(1, '#d4e9ea')
            ctx.fillStyle = gradient
            
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                ctx.lineTo(transformedPoints[i].x, transformedPoints[i].y)
            }
            ctx.closePath()
            ctx.fill()
            ctx.restore()
            
            // Update and draw fish
            for (const fish of fishes) {
                fish.update()
                fish.draw(ctx)
            }
            
            // Draw pond overlay
            ctx.save()
            ctx.translate(center.x, center.y)
            ctx.fillStyle = 'rgba(232,248,249,0.9)'
            ctx.beginPath()
            ctx.moveTo(transformedPoints[0].x, transformedPoints[0].y)
            for (let i = 1; i < transformedPoints.length; i++) {
                ctx.lineTo(transformedPoints[i].x, transformedPoints[i].y)
            }
            ctx.closePath()
            ctx.fill()
            
            // Draw pond edge
            ctx.strokeStyle = '#000'
            ctx.lineWidth = 2
            ctx.stroke()
            ctx.restore()
            
            requestAnimationFrame(draw)
        }

        window.addEventListener('resize', resize)
        resize()
        draw()
    </script>
</body>
</html>
